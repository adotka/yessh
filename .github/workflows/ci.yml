name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: host/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Go vet + test
        working-directory: host
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: PWA tests (includes ssh-keygen -L checks)
        working-directory: pwa
        run: npm test
      - name: End-to-end (docker ntfy + sshd)
        run: E2E_EXPIRY=0 e2e/run.sh
