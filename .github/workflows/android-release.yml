# Push a tag like android-v0.1.0 to publish a signed APK as a GitHub release.
# Needs the YESSH_SIGNING_* secrets (see android/README.md). Without them it fails on purpose:
# an APK signed with a throwaway key can't be updated later without losing the CA.
name: android-release
on:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.YESSH_SIGNING_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::YESSH_SIGNING_KEYSTORE_B64 secret is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        env:
          YESSH_SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          YESSH_SIGNING_STORE_PASSWORD: ${{ secrets.YESSH_SIGNING_STORE_PASSWORD }}
          YESSH_SIGNING_KEY_ALIAS: ${{ secrets.YESSH_SIGNING_KEY_ALIAS }}
          YESSH_SIGNING_KEY_PASSWORD: ${{ secrets.YESSH_SIGNING_KEY_PASSWORD }}
          YESSH_VERSION_CODE: ${{ github.run_number }}
        run: |
          export YESSH_VERSION_NAME="${GITHUB_REF_NAME#android-v}"
          ./gradlew -Pyessh.release=true :core:test :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          cp "$apk" "$RUNNER_TEMP/yessh-$YESSH_VERSION_NAME.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | tee "$RUNNER_TEMP/signer.txt"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#android-v}"
          apk="$RUNNER_TEMP/yessh-$v.apk"
          sum=$(sha256sum "$apk" | cut -d' ' -f1)
          cert=$(grep -m1 'SHA-256 digest' "$RUNNER_TEMP/signer.txt" | sed 's/.*: //')
          printf 'yessh for Android %s\n\nAPK SHA-256: `%s`\nSigning certificate SHA-256: `%s`\n\nAll updates are signed with the same key. Installing an APK signed by a different key requires uninstalling, which destroys the CA.\n' "$v" "$sum" "$cert" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "yessh Android $v" --notes-file "$RUNNER_TEMP/notes.md"
